<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Chat</title>
<style>
  html, body { margin:0; height:100%; background:#0b0e13; color:#e6edf5;
    font:15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; }

  header { padding:10px 16px; border-bottom:1px solid #242d3a; display:flex;
           align-items:center; gap:10px; background:#141a22; flex:0 0 auto; }
  header h1 { font-size:13px; margin:0; letter-spacing:.6px; font-weight:600; }
  .dot { width:8px; height:8px; border-radius:50%; background:#5b6675; }
  .dot.on { background:#4ade80; box-shadow:0 0 8px #4ade80; }
  #tally { margin-left:auto; font-size:11px; color:#8291a3; }

  /* viewer strip ------------------------------------------------------- */
  #viewers { display:flex; align-items:stretch; gap:1px; background:#242d3a;
             flex:0 0 auto; border-bottom:1px solid #242d3a; }
  .src { flex:1 1 0; background:#10161d; padding:6px 10px 7px; min-width:0; }
  .src .k { font-size:9px; letter-spacing:1.2px; color:#7b8798; font-weight:700;
            display:flex; align-items:center; gap:5px; }
  .src .k i { width:6px; height:6px; border-radius:50%; display:inline-block; }
  .src .v { font-size:22px; font-weight:700; line-height:1.1;
            font-variant-numeric:tabular-nums; }
  .src.unknown .v { color:#4b5563; font-size:15px; font-weight:600; }
  .src .n { font-size:9px; color:#5b6675; letter-spacing:.3px;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #vwTotal { background:#161c26; display:flex; flex-direction:column;
             justify-content:center; align-items:flex-end; padding:6px 12px 7px;
             min-width:74px; }
  #vwTotal .k { font-size:9px; letter-spacing:1.2px; color:#7b8798; font-weight:700; }
  #vwTotal .v { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }

  #feed { flex:1 1 auto; overflow-y:auto; padding:10px 16px;
          display:flex; flex-direction:column; gap:3px; }
  .line { word-wrap:break-word; }
  .u { font-weight:700; }
  .t { color:#e6edf5; }
  .sys { color:#a7f3d0; font-style:italic; font-size:13px; }
  .ev { color:#38bdf8; font-size:13px; }
  ::-webkit-scrollbar { width:8px; }
  ::-webkit-scrollbar-thumb { background:#2a3240; border-radius:4px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1 id="title">chat</h1>
  <span id="tally"></span>
</header>

<div id="viewers">
  <div class="src unknown" id="src-twitch">
    <div class="k"><i style="background:#9146FF"></i>TWITCH</div>
    <div class="v">—</div>
    <div class="n">&nbsp;</div>
  </div>
  <div class="src unknown" id="src-youtube">
    <div class="k"><i style="background:#FF0000"></i>YOUTUBE</div>
    <div class="v">—</div>
    <div class="n">&nbsp;</div>
  </div>
  <div class="src unknown" id="src-vertical">
    <div class="k"><i style="background:#C8161D"></i>VERTICAL</div>
    <div class="v">—</div>
    <div class="n">&nbsp;</div>
  </div>
  <div id="vwTotal">
    <div class="k">TOTAL</div>
    <div class="v">—</div>
  </div>
</div>

<div id="feed"></div>
<script>
const feed = document.getElementById('feed');
const MAX = 300;
let counts = { chat: 0, alerts: 0 };

const PALETTE = ['#4ade80','#38bdf8','#fbbf24','#f472b6','#a78bfa','#fb923c','#34d399','#60a5fa'];
function colourFor(name){ let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0; return PALETTE[h%PALETTE.length]; }

function add(evt) {
  const el = document.createElement('div');
  if (evt.type === 'system') {
    el.className = 'line sys';
    el.textContent = '▸ ' + (evt.message || '');
  } else if (evt.type === 'chat') {
    el.className = 'line';
    const u = document.createElement('span');
    u.className = 'u'; u.style.color = colourFor(evt.user || 'anon');
    u.textContent = (evt.user || 'anon') + ': ';
    const t = document.createElement('span');
    t.className = 't'; t.textContent = evt.message || '';
    el.append(u, t);
    counts.chat++;
  } else {
    el.className = 'line ev';
    const amt = evt.amount ? ` (${evt.amount})` : '';
    el.textContent = `★ ${evt.type} — ${evt.user || ''}${amt} ${evt.message || ''}`;
    counts.alerts++;
  }
  feed.appendChild(el);
  while (feed.children.length > MAX) feed.removeChild(feed.firstElementChild);
  feed.scrollTop = feed.scrollHeight;
  document.getElementById('tally').textContent = `${counts.chat} chat · ${counts.alerts} events`;
}

// ---------------------------------------------------------------- viewers
// Every source reports a state, not just a number, so the panel can say "no API
// key" instead of showing a confident zero. A viewer counter that lies is worse
// than one that admits it does not know.
const STATE_TEXT = {
  offline:      'offline',
  'no-api-key': 'no API key',
  'no-video-id':'no video id',
  unavailable:  'unavailable',
  unconfigured: 'not configured',
  error:        'error',
};

function renderSource(el, src) {
  const v = el.querySelector('.v');
  const n = el.querySelector('.n');
  if (!src) return;

  if (src.state === 'ok' && typeof src.viewers === 'number') {
    el.classList.remove('unknown');
    v.textContent = src.viewers.toLocaleString();
    n.textContent = src.game || (src.live ? 'live' : '');
    el.title = `${src.label}: ${src.viewers} watching`;
  } else {
    el.classList.add('unknown');
    v.textContent = '—';
    n.textContent = STATE_TEXT[src.state] || src.state || '';
    el.title = src.detail ? `${src.label}: ${src.detail}` : (el.title || '');
  }
}

async function pollViewers() {
  try {
    const r = await fetch('/api/viewers', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();

    for (const src of d.sources || []) {
      const el = document.getElementById('src-' + src.id);
      if (el) renderSource(el, src);
    }
    const totalEl = document.querySelector('#vwTotal .v');
    totalEl.textContent = (typeof d.total === 'number') ? d.total.toLocaleString() : '—';
    document.getElementById('vwTotal').title =
      d.known ? `${d.total} across ${d.known} known source(s)` : 'no source reports a count';
  } catch (e) {
    // leave the last good numbers up rather than blanking the strip
  }
}

pollViewers();
setInterval(pollViewers, 30000);

// ------------------------------------------------------------------- socket
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws?role=control`);
  ws.onopen = () => { document.getElementById('dot').className = 'dot on'; };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.kind === 'event') add(m);
    else if (m.kind === 'obs_event' && m.event === 'CurrentProgramSceneChanged') {
      document.getElementById('title').textContent = 'chat · ' + m.data.sceneName;
    }
  };
  ws.onclose = () => { document.getElementById('dot').className = 'dot'; setTimeout(connect, 1500); };
  ws.onerror = () => ws.close();
}
connect();
</script>
</body>
</html>
