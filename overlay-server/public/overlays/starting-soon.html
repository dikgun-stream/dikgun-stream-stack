<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Starting Soon</title>
<style>
  html, body {
    margin: 0; height: 100%; width: 100%; background: transparent; overflow: hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
  }
  .card {
    text-align: center;
    padding: 34px 64px 40px;
    border-radius: 24px;
    background: rgba(10,13,18,.82);
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 24px 70px rgba(0,0,0,.65);
    backdrop-filter: blur(6px);
    min-width: 620px;
  }
  .headline {
    font-size: 22px; font-weight: 800; letter-spacing: 6px; text-transform: uppercase;
    color: #4ade80; margin-bottom: 6px;
  }
  .clock {
    font-size: 108px; font-weight: 900; letter-spacing: -3px; line-height: 1.05;
    color: #f7fbff; font-variant-numeric: tabular-nums;
    text-shadow: 0 6px 30px rgba(0,0,0,.8);
  }
  .subline { font-size: 20px; color: #a9bcd0; margin-top: 6px; }
  .bar { margin: 22px auto 0; width: 460px; height: 6px; border-radius: 999px;
         background: rgba(255,255,255,.1); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%;
             background: linear-gradient(90deg,#4ade80,#a7f3d0); transform-origin: left center; }
</style>
</head>
<body>
<div id="stage">
  <div class="card">
    <div class="headline" id="headline">Starting Soon</div>
    <div class="clock" id="clock">05:00</div>
    <div class="subline" id="subline">Grab a drink.</div>
    <div class="bar"><i id="bar"></i></div>
  </div>
</div>
<script>
const params  = new URLSearchParams(location.search);
const channel = params.get('ch') || 'starting-soon';

let minutes  = Number(params.get('minutes')) || 5;
let headline = params.get('headline') || 'Starting Soon';
let subline  = params.get('subline')  || 'Grab a drink.';

let endsAt = 0, total = 0, timer = null;

const clockEl = document.getElementById('clock');
const barEl   = document.getElementById('bar');
const headEl  = document.getElementById('headline');
const subEl   = document.getElementById('subline');

function applyLabels() {
  headEl.textContent = headline;
  subEl.textContent  = subline;
}

function start(mins) {
  minutes = Math.max(1, Number(mins) || 5);
  total = minutes * 60 * 1000;
  endsAt = Date.now() + total;
  applyLabels();
  tick();
  if (timer) clearInterval(timer);
  timer = setInterval(tick, 250);
}

function tick() {
  const left = Math.max(0, endsAt - Date.now());
  const s = Math.floor(left / 1000);
  const mm = String(Math.floor(s / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  clockEl.textContent = `${mm}:${ss}`;
  barEl.style.transform = `scaleX(${total ? (left / total) : 1})`;
  if (left <= 0 && timer) { clearInterval(timer); timer = null; }
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws?role=overlay&ch=${encodeURIComponent(channel)}`);
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.kind === 'config' && m.config && m.config.starting_soon) {
      const cfg = m.config.starting_soon;
      headline = cfg.headline || headline;
      subline  = cfg.subline  || subline;
      if (total === 0) start(cfg.minutes);
      else applyLabels();
    } else if (m.kind === 'event') {
      // {type:'timer', amount:<minutes>} restarts the countdown
      if (m.type === 'timer' || m.type === 'test') start(m.amount || minutes);
    }
  };
  ws.onclose = () => setTimeout(connect, 1200);
  ws.onerror = () => ws.close();
}
connect();
start(minutes);
</script>
</body>
</html>
