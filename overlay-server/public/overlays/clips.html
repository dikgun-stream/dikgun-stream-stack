<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Clip Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/scene.css">
<style>
  /* Full-bleed footage with a neosoviet plate carrying the game it came from.

     Query parameters:
       game=NAME    only play clips from that game folder
       start=0.15   seek to this fraction of the file before playing
       len=45       play this many seconds, then advance (0 = play to the end)
       mute=0       unmute (default is muted: this runs under a live stream)
       shuffle=0    play in order instead of randomly
  */

  html, body { background: #000; }

  #vid {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
    background: #000;
  }

  /* darken the lower third so the plate always has contrast, without a blur */
  #shade {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 42%;
    z-index: 2; pointer-events: none;
    background: linear-gradient(to top, rgba(10,9,8,.92), rgba(10,9,8,0));
  }

  /* Optional headline block, so this same player can carry the Starting Soon
     and Ending looks instead of those pages needing their own video element
     (which never reliably decoded inside OBS). ?title= / ?sub= / ?minutes= */
  #titleblock {
    position: absolute; z-index: 5;
    left: calc(var(--u12) + 40px); top: 9%;
    display: none;
    max-width: 62%;
  }
  #titleblock.on { display: block; }
  #ovTitle {
    font-family: var(--display);
    font-weight: 700;
    font-size: 13.5vmin;
    line-height: .82;
    letter-spacing: -.02em;
    text-transform: uppercase;
    color: var(--paper-hi);
    text-shadow: 0 6px 34px rgba(0,0,0,.85), 0 2px 6px rgba(0,0,0,.9);
  }
  #ovSub {
    margin-top: 1.6vmin;
    font-family: var(--mono);
    font-size: 1.5vmin;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--paper-hi);
    border-left: var(--rule-mid) solid var(--red);
    padding-left: 12px;
    text-shadow: 0 2px 10px rgba(0,0,0,.9);
  }
  /* countdown sits opposite the headline */
  #ovTimer {
    position: absolute; z-index: 5; display: none;
    right: calc(var(--u12) + 40px); top: 8%;
    text-align: right;
  }
  #ovTimer.on { display: block; }
  #ovTimer .k {
    font-family: var(--mono); font-size: 1.3vmin; letter-spacing: .3em;
    color: rgba(246,241,230,.8); text-shadow: 0 2px 8px rgba(0,0,0,.9);
  }
  #ovTimer .v {
    font-family: var(--display); font-weight: 500;
    font-size: 17vmin; line-height: .9;
    font-variant-numeric: tabular-nums;
    color: var(--paper-hi);
    text-shadow: 0 6px 30px rgba(0,0,0,.85);
  }
  .v #titleblock { left: var(--u6); right: var(--u6); max-width: none; top: 7%; }
  .v #ovTitle { font-size: 17vmin; }
  .v #ovSub { font-size: 2.2vmin; }
  .v #ovTimer { right: var(--u6); top: auto; bottom: 34vmin; }
  .v #ovTimer .v { font-size: 20vmin; }

  #plate {
    position: absolute; z-index: 5;
    left: 0; right: 0; bottom: 0;
    display: flex; align-items: stretch;
    background: var(--ink);
    border-top: var(--rule-thick) solid var(--red);
  }

  .game-cell {
    flex: 1 1 auto; min-width: 0;
    padding: 1.8vmin var(--u8) 1.8vmin calc(var(--u12) + 40px);
    display: flex; flex-direction: column; justify-content: center;
  }
  .game-cell .k {
    font-family: var(--mono);
    font-size: 1.15vmin; letter-spacing: .34em;
    color: var(--steel);
    margin-bottom: 4px;
  }
  .game-cell .v {
    font-family: var(--display);
    font-weight: 700;
    font-size: 5.2vmin;
    line-height: .92;
    letter-spacing: -.005em;
    text-transform: uppercase;
    color: var(--paper-hi);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .game-cell .v.is-long { font-size: 3.9vmin; }

  /* the red stamp: which game this is, held at a fixed size */
  .stamp {
    flex: 0 0 auto;
    width: 26vmin;
    background: var(--red);
    color: var(--paper-hi);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 1.4vmin 1vmin;
  }
  .stamp .n {
    font-family: var(--display); font-weight: 700;
    font-size: 3.4vmin; line-height: 1;
    text-transform: uppercase;
  }
  .stamp .l {
    font-family: var(--mono);
    font-size: 1vmin; letter-spacing: .3em;
    margin-top: 4px; opacity: .85;
  }

  #title {
    position: absolute; z-index: 5;
    left: var(--u12); top: var(--u8);
    font-family: var(--mono);
    font-size: 1.5vmin; letter-spacing: .2em;
    color: rgba(246,241,230,.85);
    text-shadow: 0 2px 10px rgba(0,0,0,.9);
    max-width: 70%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* thin progress rule along the very top */
  #prog {
    position: absolute; z-index: 6; top: 0; left: 0;
    height: 4px; width: 0%;
    background: var(--red);
    transition: width .25s linear;
  }

  #msg {
    position: absolute; inset: 0; z-index: 4;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 2vmin; letter-spacing: .2em;
    color: var(--steel); text-transform: uppercase;
  }
  #msg.hide { display: none; }

  /* ---- vertical ---------------------------------------------------------- */
  .v .game-cell { padding: 2.4vmin var(--u4) 2.4vmin calc(var(--u6) + 20px); }
  .v .game-cell .v { font-size: 5.6vmin; white-space: normal; }
  .v .game-cell .v.is-long { font-size: 4.4vmin; }
  .v .stamp { width: 22vmin; }
  .v .stamp .n { font-size: 3.2vmin; }
  .v #title { left: var(--u6); right: var(--u6); max-width: none; font-size: 1.8vmin; }
/* ---------------------------------------------------------------------- wipe
   A slab that sweeps across the frame between clips. The source swap happens
   while the screen is covered, so changing clip does not read as a hard jump.

   Geometry: 124% wide and offset -12%, so translateX(0) covers the viewport
   with room for the leading edge, and +-100% parks it fully off either side. */
#wipe {
  position: fixed; top: -1px; bottom: -1px;
  left: -12%; width: 124%;
  z-index: 90; pointer-events: none;
  background: var(--red);
  transform: translateX(-100%);
  will-change: transform;
}
/* ink edge so the sweep reads as a moving object rather than a flash */
#wipe::before {
  content: '';
  position: absolute; top: 0; bottom: 0; right: 0;
  width: calc(var(--rule-slab) + 8px);
  background: var(--ink);
}
/* paper hairline beside it, matching the plate rules */
#wipe::after {
  content: '';
  position: absolute; top: 0; bottom: 0;
  right: calc(var(--rule-slab) + 8px);
  width: var(--rule-thin);
  background: var(--paper);
}
/* vertical scenes are narrower: keep the edge proportional */
.v #wipe::before, .v #wipe::after { width: calc(var(--rule-mid) + 6px); }

/* second video, so the incoming clip can be prepared under the cover */
#vid2 {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: 1;
  background: #000;
}
/* whichever video is idle sits behind and does not paint */
#vid:not(.live), #vid2:not(.live) { opacity: 0; }

/* the incoming game name, carried on the banner */
#wipeName {
  position: absolute; left: 0; right: 0; top: 50%;
  transform: translateY(-50%);
  text-align: center;
  font-family: 'Oswald', 'Rubik', sans-serif;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .03em;
  font-size: 8.5vmin;
  line-height: 1.02;
  color: var(--paper-hi);
  padding: 0 5%;
  word-break: break-word;
}
/* vertical scenes are narrower: less of the name fits */
.v #wipeName { font-size: 6.2vmin; }

</style>
</head>
<body>
<div id="stage">
  <video id="vid" class="live" playsinline preload="auto"></video>
  <video id="vid2" playsinline preload="auto"></video>
  <div id="wipe"><div id="wipeName"></div></div>
  <div id="shade"></div>
  <div id="prog"></div>
  <div id="title"></div>
  <div id="msg">INDEXING CLIPS</div>

  <div id="titleblock">
    <div id="ovTitle"></div>
    <div id="ovSub"></div>
  </div>
  <div id="ovTimer">
    <div class="k">CONNECT IN</div>
    <div class="v" id="ovClock">--:--</div>
  </div>

  <div id="plate">
    <div class="game-cell">
      <span class="k">FOOTAGE FROM</span>
      <span class="v" id="game">-</span>
    </div>
    <div class="stamp">
      <span class="n" id="idx">-- / --</span>
      <span class="l">CLIP</span>
    </div>
  </div>
</div>

<script>

(() => {
  const params = new URLSearchParams(location.search);
  const vertical = params.get('v') === '1' || window.innerHeight > window.innerWidth * 1.2;
  if (vertical) document.documentElement.classList.add('v');

  const onlyGame = params.get('game') || '';
  const startFrac = Number(params.get('start') ?? 0.12);
  const fallbackLen = Number(params.get('len') ?? 45);   // only for clips with no windows
  const muted = params.get('mute') !== '0';
  const shuffle = params.get('shuffle') !== '0';

  const vids = [document.getElementById('vid'), document.getElementById('vid2')];
  let active = vids[0];
  let activeIdx = 0;

  const gameEl = document.getElementById('game');
  const titleEl = document.getElementById('title');
  const idxEl = document.getElementById('idx');
  const msgEl = document.getElementById('msg');
  const progEl = document.getElementById('prog');
  const wipeEl = document.getElementById('wipe');
  const wipeName = document.getElementById('wipeName');

  for (const v of vids) { v.muted = muted; v.volume = muted ? 0 : 1; }

  // optional headline / subline / countdown so this one player can carry the
  // Starting Soon and Ending looks
  const ovTitle = params.get('title') || '';
  const ovSub = params.get('sub') || '';
  const ovMinutes = Number(params.get('minutes') || 0);
  if (ovTitle || ovSub) {
    document.getElementById('ovTitle').textContent = ovTitle;
    document.getElementById('ovSub').textContent = ovSub;
    document.getElementById('titleblock').classList.add('on');
  }
  if (ovMinutes > 0) {
    const box = document.getElementById('ovTimer');
    const clock = document.getElementById('ovClock');
    box.classList.add('on');
    const endsAt = Date.now() + ovMinutes * 60000;
    const pad = (n) => String(n).padStart(2, '0');
    const tick = () => {
      const left = Math.max(0, endsAt - Date.now());
      const sec = Math.floor(left / 1000);
      clock.textContent = `${pad(Math.floor(sec / 60))}:${pad(sec % 60)}`;
    };
    tick();
    setInterval(tick, 500);
  }

  let clips = [];
  let order = [];
  let pos = 0;
  let firstClip = true;
  let switching = false;

  // ---------------------------------------------------------------- playback
  // The list of spans worth watching inside the current file, and which one is
  // playing. Everything below advances through these rather than through the
  // file from zero.
  let winList = [];
  let winIdx = 0;

  const WIPE_MS = 600;          // one sweep; long enough to read
  const PRELOAD_TIMEOUT = 1500;
  const HOLD_MS = 350;          // guaranteed still time at full cover

  function encPath(clip) {
    const mount = clip.mount || 'videos';
    const rel = String(clip.rel || clip);
    return '/' + mount + '/' + rel.split('/').map(encodeURIComponent).join('/');
  }

  function shuffleInto(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function labelGame(name) {
    gameEl.textContent = (name || 'UNKNOWN').toUpperCase();
    gameEl.classList.toggle('is-long', (name || '').length > 16);
  }

  function idleVideo() { return vids[1 - activeIdx]; }

  /* The spans to play for a clip. Falls back to the old single-window behaviour
     for library entries that were never scanned, so this still works when the
     highlight indexes are missing. */
  function windowsFor(clip) {
    const w = clip && clip.windows;
    if (Array.isArray(w) && w.length && Array.isArray(w[0]) && w[0].length === 2) {
      return w.map((p) => [Number(p[0]) || 0, Number(p[1]) || 0])
              .filter((p) => p[1] > p[0]);
    }
    const start = Number(clip.start);
    if (Number.isFinite(start) && start > 0) {
      return [[start, start + (Number(clip.len) || fallbackLen)]];
    }
    return null;   // unknown: fall back to a random seek like before
  }

  function seekInto(video, seconds) {
    try { video.currentTime = Math.max(0, seconds); } catch (e) { /* not seekable yet */ }
  }

  function seekToWindow(i) {
    if (!winList[i]) return;
    seekInto(active, winList[i][0]);
  }

  function progress() {
    if (!winList.length) return;
    let total = 0, done = 0;
    for (let i = 0; i < winList.length; i++) {
      const len = Math.max(0.1, winList[i][1] - winList[i][0]);
      total += len;
      if (i < winIdx) done += len;
      else if (i === winIdx) done += Math.min(len, Math.max(0, active.currentTime - winList[i][0]));
    }
    if (total > 0) progEl.style.width = `${Math.min(100, (done / total) * 100)}%`;
  }

  function tickPlayback() {
    if (!winList.length || active.paused) return;
    const w = winList[winIdx];
    if (!w) return;
    progress();
    if (active.currentTime >= w[1] - 0.06) {
      if (winIdx + 1 < winList.length) {
        winIdx += 1;
        seekToWindow(winIdx);
      } else {
        advance();
      }
    }
  }
  setInterval(tickPlayback, 200);

  // ------------------------------------------------------------- transitions
  function wipeTo(xPercent, ms) {
    return new Promise((resolve) => {
      if (ms <= 0) {
        wipeEl.style.transition = 'none';
        wipeEl.style.transform = `translateX(${xPercent}%)`;
        void wipeEl.offsetWidth;
        resolve();
        return;
      }
      wipeEl.style.transition = `transform ${ms}ms cubic-bezier(.62,.05,.36,1)`;
      wipeEl.style.transform = `translateX(${xPercent}%)`;
      setTimeout(resolve, ms + 10);
    });
  }

  /* Point a video at a clip and put it on that clip's first span.
     Resolves on metadata (or the timeout) - never on 'playing', because the
     source files are hundreds of MB and waiting for playback would hold the
     banner on screen. */
  function loadInto(video, clip, timeoutMs) {
    return new Promise((resolve) => {
      const url = encPath(clip);
      const wins = windowsFor(clip);

      const arm = () => {
        if (wins && wins.length) seekInto(video, wins[0][0]);
        else {
          const dur = Number.isFinite(video.duration) && video.duration > 30 ? video.duration : 0;
          const from = Number.isFinite(startFrac) && startFrac > 0 ? startFrac : 0;
          const maxStart = Math.max(0, dur - Math.max(20, fallbackLen || 20));
          seekInto(video, Math.min(maxStart, dur * from + Math.random() * 30));
        }
        resolve();
      };

      if (video.dataset.url !== url) {
        video.dataset.url = url;
        try { video.pause(); } catch (e) { /* ignore */ }
        try { video.src = url; } catch (e) { resolve(); return; }
      }

      if (video.readyState >= 1) { arm(); return; }

      let done = false;
      const finish = () => { if (done) return; done = true; arm(); };
      video.addEventListener('loadedmetadata', finish, { once: true });
      setTimeout(finish, timeoutMs || PRELOAD_TIMEOUT);
    });
  }

  /* Load the next clip into the hidden video while the current one plays. This
     is what makes the trailing edge reveal a live frame instead of black. */
  function preloadNext() {
    if (!order.length) return;
    const next = order[(pos + 1) % order.length];
    const iv = idleVideo();
    if (!next || iv.dataset.url === encPath(next)) return;
    loadInto(iv, next, 4000);
  }

  async function play(index, opts) {
    opts = opts || {};
    if (switching) return;
    if (!order.length) {
      msgEl.textContent = 'NO CLIPS FOUND';
      msgEl.classList.remove('hide');
      return;
    }

    // The very first clip loads without a wipe: there is nothing to transition
    // from, and a sweep before the stream starts looks like a fault.
    const instant = opts.instant === true || firstClip;
    const nextPos = ((index % order.length) + order.length) % order.length;
    const clip = order[nextPos];

    try {
      if (!instant) {
        switching = true;
        // the banner carries the game that is coming in, not the one leaving
        wipeName.textContent = (clip.game || '').toUpperCase();
        await wipeTo(0, WIPE_MS);
      }

      pos = nextPos;
      labelGame(clip.game);
      titleEl.textContent = clip.title || clip.file;
      idxEl.textContent = `${pos + 1} / ${order.length}`;
      msgEl.classList.add('hide');
      progEl.style.width = '0%';

      // instant: reuse whatever is already visible. otherwise the hidden video,
      // which preloadNext has usually already pointed at this clip.
      const incoming = instant ? active : idleVideo();
      await loadInto(incoming, clip, instant ? 2500 : PRELOAD_TIMEOUT);

      incoming.play().catch(() => {
        incoming.muted = true;
        incoming.play().catch(() => {
          msgEl.textContent = 'CLICK TO PLAY';
          msgEl.classList.remove('hide');
        });
      });

      winList = windowsFor(clip) || [];
      winIdx = 0;

      // Do not uncover until the incoming video has painted something. Without
      // this the sweep-out can reveal a black frame on a cold cache, because
      // metadata alone does not guarantee a decoded picture.
      await Promise.race([
        new Promise((r) => incoming.addEventListener('playing', r, { once: true })),
        new Promise((r) => setTimeout(r, 250)),
      ]);

      // Then hold regardless. Painting can happen in a few milliseconds, which
      // left the game name on screen for barely a frame - it was unreadable.
      await new Promise((r) => setTimeout(r, HOLD_MS));

      if (!instant) {
        // swap visibility only now, with the frame already decoded behind the
        // banner, so the trailing edge uncovers the new clip rather than black
        active.classList.remove('live');
        incoming.classList.add('live');
        active = incoming;
        activeIdx = vids.indexOf(active);

        await wipeTo(100, WIPE_MS);
        await wipeTo(-100, 0);
      }

      firstClip = false;
      preloadNext();
    } finally {
      switching = false;
      // never leave the banner parked over the picture
      if (wipeEl && wipeEl.style.transform !== 'translateX(-100%)') {
        wipeTo(-100, 0);
      }
    }
  }

  function advance() { play(pos + 1); }

  for (const v of vids) {
    v.addEventListener('error', () => {
      if (v !== active) return;
      setTimeout(advance, 1200);      // a missing codec must not stall the loop
    });
  }

  // ---------------------------------------------------------------- clip list
  async function load() {
    try {
      const source = params.get('source') || '';
      let url = `/api/clips${onlyGame ? `?game=${encodeURIComponent(onlyGame)}` : ''}`;
      let data;
      if (source) {
        url = `/api/clips/highlights?source=${encodeURIComponent(source)}`;
        data = await (await fetch(url, { cache: 'no-store' })).json();
        clips = data.highlights || [];
        if (!clips.length) {
          data = await (await fetch(`/api/clips${onlyGame ? `?game=${encodeURIComponent(onlyGame)}` : ''}`,
                                    { cache: 'no-store' })).json();
          clips = data.clips || [];
        }
      } else {
        data = await (await fetch(url, { cache: 'no-store' })).json();
        clips = data.clips || [];
      }
      if (!clips.length) {
        msgEl.textContent = data.available === false ? 'CLIP FOLDER MISSING'
          : (source ? 'NO HIGHLIGHTS YET' : 'NO CLIPS FOUND');
        msgEl.classList.remove('hide');
        return;
      }
      const wasEmpty = !order.length;
      order = shuffle ? shuffleInto(clips) : clips.slice();
      if (wasEmpty) play(0, { instant: true });
    } catch (e) {
      msgEl.textContent = 'CLIP API UNREACHABLE';
      msgEl.classList.remove('hide');
    }
  }

  load();
  setInterval(load, 10 * 60 * 1000);   // pick up newly recorded clips

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') advance();
    if (e.key === 'ArrowLeft') play(pos - 1);
  });
})();

</script>
</body>
</html>
