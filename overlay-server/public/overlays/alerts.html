<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Alerts Overlay</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: transparent; overflow: hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

  .card {
    --accent: #4ade80;
    position: relative;
    min-width: 520px; max-width: 900px;
    padding: 26px 44px 30px;
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(16,20,27,.96), rgba(10,13,18,.96));
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 18px 60px rgba(0,0,0,.65), 0 0 42px -6px var(--accent);
    text-align: center;
    transform: translateY(38px) scale(.94);
    opacity: 0;
    transition: transform .42s cubic-bezier(.18,.89,.32,1.18), opacity .3s ease;
  }
  .card.show { transform: translateY(0) scale(1); opacity: 1; }
  .card.hide { transform: translateY(-26px) scale(.97); opacity: 0; transition-duration: .35s; }
  .card::before {
    content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 5px;
    border-radius: 5px; background: var(--accent); box-shadow: 0 0 16px var(--accent);
  }
  .label { font-size: 15px; font-weight: 800; letter-spacing: 3.4px; text-transform: uppercase;
           color: var(--accent); margin-bottom: 10px; }
  .who { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .em { font-size: 46px; line-height: 1; filter: drop-shadow(0 3px 10px rgba(0,0,0,.6)); }
  .name { font-size: 50px; font-weight: 900; letter-spacing: -.8px; color: #f7fbff;
          text-shadow: 0 4px 22px rgba(0,0,0,.85); word-break: break-word; }
  .detail { margin-top: 12px; font-size: 24px; font-weight: 600; color: #cfe0f0;
            text-shadow: 0 3px 14px rgba(0,0,0,.8); }
  .detail:empty { display: none; }
  .msg { margin-top: 10px; font-size: 21px; font-weight: 500; font-style: italic;
         color: #b9cbdd; text-shadow: 0 3px 14px rgba(0,0,0,.8); }
  .msg:empty { display: none; }
  .bar { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%;
         border-radius: 0 0 18px 18px; background: var(--accent); opacity: .85;
         transform-origin: left center; }
  .bar.run { animation: shrink var(--dur, 4.5s) linear forwards; }
  @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
</style>
</head>
<body>
<div id="stage"></div>

<script>
const STYLES = {
  follow:  { accent: '#4ade80', label: 'New Follower',   emoji: '💚' },
  sub:     { accent: '#facc15', label: 'New Subscriber', emoji: '⭐' },
  resub:   { accent: '#facc15', label: 'Resub',          emoji: '🔁' },
  giftsub: { accent: '#fb923c', label: 'Gifted Sub',     emoji: '🎁' },
  cheer:   { accent: '#a78bfa', label: 'Bits',           emoji: '💎' },
  raid:    { accent: '#38bdf8', label: 'Raid Incoming',  emoji: '🚀' },
  tip:     { accent: '#34d399', label: 'Tip',            emoji: '💰' },
  host:    { accent: '#f472b6', label: 'Host',           emoji: '📺' },
  test:    { accent: '#94a3b8', label: 'Test',           emoji: '🧪' },
};

const params  = new URLSearchParams(location.search);
const channel = params.get('ch') || 'alerts';

let settings = { duration_ms: 4500, max_queue: 6, sound: false };

const stage = document.getElementById('stage');
const queue = [];
let showing = false;
let actx = null;

function blip(accent) {
  if (!settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = 660;
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.06, actx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.28);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.3);
  } catch {}
}

function makeCard(evt) {
  const s = STYLES[evt.type] || STYLES.test;
  const dur = Math.max(800, Number(settings.duration_ms) || 4500);

  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--accent', s.accent);
  card.style.setProperty('--dur', (dur / 1000) + 's');

  const label = document.createElement('div');
  label.className = 'label'; label.textContent = s.label;

  const who = document.createElement('div'); who.className = 'who';
  const em = document.createElement('div'); em.className = 'em'; em.textContent = s.emoji;
  const name = document.createElement('div'); name.className = 'name'; name.textContent = evt.user || 'Someone';
  who.append(em, name);
  card.append(label, who);

  let detail = '';
  if (evt.type === 'cheer' && evt.amount)        detail = `${evt.amount} bits`;
  else if (evt.type === 'raid' && evt.amount)    detail = `${evt.amount} raiders`;
  else if (evt.type === 'sub' && evt.amount)     detail = `${evt.amount} month${Number(evt.amount) > 1 ? 's' : ''}`;
  else if (evt.type === 'giftsub' && evt.amount) detail = `${evt.amount} gifted`;
  else if (evt.amount)                           detail = String(evt.amount);

  if (detail) {
    const d = document.createElement('div');
    d.className = 'detail'; d.textContent = detail; card.appendChild(d);
  }
  if (evt.message) {
    const m = document.createElement('div');
    m.className = 'msg'; m.textContent = `“${evt.message}”`; card.appendChild(m);
  }

  const bar = document.createElement('div'); bar.className = 'bar'; card.appendChild(bar);
  return { card, bar, accent: s.accent, dur };
}

function showNext() {
  if (showing || queue.length === 0) return;
  showing = true;

  const evt = queue.shift();
  const { card, bar, accent, dur } = makeCard(evt);
  stage.replaceChildren(card);
  blip(accent);

  requestAnimationFrame(() => { card.classList.add('show'); bar.classList.add('run'); });

  setTimeout(() => {
    card.classList.remove('show');
    card.classList.add('hide');
    setTimeout(() => { stage.replaceChildren(); showing = false; showNext(); }, 380);
  }, dur);
}

function enqueue(evt) {
  const max = Math.max(1, Number(settings.max_queue) || 6);
  if (queue.length >= max) queue.shift();
  queue.push(evt);
  showNext();
}

// ---- websocket to the local server --------------------------------------
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws?role=overlay&ch=${encodeURIComponent(channel)}`);

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.kind === 'config' && msg.config && msg.config.alerts) {
      settings = { ...settings, ...msg.config.alerts };
    } else if (msg.kind === 'event') {
      enqueue(msg);
    }
  };
  ws.onclose = () => setTimeout(connect, 1200);
  ws.onerror = () => ws.close();
}
connect();

// manual testing from the console: window.__alert({type:'follow', user:'Console'})
window.__alert = enqueue;
</script>
</body>
</html>
